<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR-коды точек Саки</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@800;900&family=Geologica:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--paper:#F3EAD8;--card:#FFFBF2;--ink:#1E2A22;--muted:#6B6656;--forest:#2F4A37;--leaf:#D9982F;--terra:#B85B34;
  --f-display:"Sofia Sans Extra Condensed","Arial Narrow",sans-serif;--f-body:"Geologica","Segoe UI",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:300 15px/1.5 var(--f-body)}
.head{max-width:1100px;margin:0 auto;padding:28px 16px 10px;display:grid;gap:10px}
.head h1{margin:0;font:900 44px/.9 var(--f-display);text-transform:uppercase}
.head p{margin:0;max-width:70ch;color:#3F463C}
.head code{font:600 13px var(--f-mono);background:#fff;padding:3px 7px;border-radius:6px;word-break:break-all}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar small{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.bar button,.dl button{font:600 13px/1 var(--f-body);border:1px solid #D8C9AA;background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:#fff}
.bar .print{background:var(--terra);border-color:var(--terra);color:#fff}
.bar+.bar{margin-top:-2px}
.grid{max-width:1100px;margin:0 auto;padding:16px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border-radius:18px;padding:20px;display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;box-shadow:0 1px 0 #E3D7BE;break-inside:avoid}
.qr{width:120px;height:120px}
.qr svg{width:100%;height:100%;display:block}
.num{font:600 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
.card b{display:block;font:800 23px/1 var(--f-display);text-transform:uppercase;margin:6px 0}
.card .hint{font-size:13px;color:var(--muted);line-height:1.4}
.card .r{font:600 11px/1.4 var(--f-mono);color:var(--forest);margin-top:6px}
.card .park,.card .url{display:none}
.dl{display:flex;gap:6px;margin-top:10px}
.dl button{padding:6px 10px;font-size:12px}
.big .grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.big .card{grid-template-columns:1fr;text-align:center;justify-items:center;padding:26px 22px;gap:10px;aspect-ratio:148/210;align-content:center}
.big .card .park{display:block;font:600 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--forest)}
.big .qr{width:min(100%,220px);height:auto;aspect-ratio:1}
.big .card b{font-size:34px;margin:4px 0 6px}
.big .card .hint{font-size:14px}
.big .card .url{display:block;font:400 10px/1.3 var(--f-mono);color:var(--muted);word-break:break-all}
.big .dl{justify-content:center}
@media (max-width:420px){.card{grid-template-columns:96px 1fr;padding:16px}.qr{width:96px;height:96px}.head h1{font-size:36px}}
@page{size:A4;margin:12mm}
@page sign{size:A5;margin:12mm}
@media print{
  body{background:#fff}.head,.dl{display:none!important}
  .grid{padding:0;max-width:none}
  .card{box-shadow:none}
  body:not(.big) .grid{grid-template-columns:1fr 1fr;gap:10mm}
  body:not(.big) .card{border:1px solid #DCCFB3;border-radius:6mm;padding:7mm;grid-template-columns:42mm 1fr}
  body:not(.big) .qr{width:42mm;height:42mm}
  body:not(.big) .card:nth-child(6n){break-after:page}
  .big .grid{display:block}
  .big .card{page:sign;width:auto;height:184mm;aspect-ratio:auto;border-radius:0;background:#fff;padding:0;break-after:page;gap:4mm}
  .big .card .park{font-size:10pt}
  .big .qr{width:90mm;height:90mm}
  .big .card b{font-size:34pt}
  .big .card .hint{font-size:12pt;max-width:110mm}
  .big .card .url{font-size:8pt}
}
</style>
<div class="head">
  <h1>QR-коды точек терренкуров</h1>
  <p>Распечатайте и разместите на стендах у точек (Ctrl+P). Человек наводит камеру телефона — сразу открывается рассказ об этом месте; если он идёт по маршруту, точка ещё и отмечается на карте, даже когда GPS под деревьями неточный. Коды ведут на <code id="base"></code></p>
  <div class="bar" id="routes"><small>Точки</small></div>
  <div class="bar"><small>Формат</small>
    <button type="button" data-f="small" aria-pressed="true">Карточки · 6 на A4</button>
    <button type="button" data-f="big" aria-pressed="false">Таблички · по одной на A5</button>
    <button type="button" class="print" onclick="print()">Печать</button>
  </div>
</div>
<div class="grid" id="grid"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="assets/routes.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),P=new URLSearchParams(location.search);
const SITE='https://komar666.github.io/saki-trails/map.html';
const here=location.href.replace(/[?#].*$/,'').replace(/qr\.html$/,'map.html');
const local=location.protocol==='file:'||/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const base=P.get('base')||(local?SITE:here);
$('base').textContent=base;
const all=new Map();
ROUTES.forEach(r=>r.stops.forEach(s=>{const key=s.poi?String(s.poi):'pine';
  if(!all.has(key))all.set(key,{key,s,routes:new Set()});all.get(key).routes.add(r.id)}));
let rid=+P.get('route')||0,fmt=P.get('format')==='big'?'big':'small';
function items(){
  if(!rid)return [...all.values()].sort((a,b)=>(+a.key||99)-(+b.key||99)).map(it=>({...it,label:it.key==='pine'?'Точка':'Точка № '+it.key}));
  const r=ROUTES.find(r=>r.id===rid),out=[],seen=new Set();
  r.stops.forEach((s,i)=>{const key=s.poi?String(s.poi):'pine';if(seen.has(key))return;seen.add(key);
    out.push({...all.get(key),label:r.name+' · точка '+(i+1)})});
  return out;
}
const svgOf=key=>{const qr=qrcode(0,'M');qr.addData(base+'#cp-'+key);qr.make();return qr};
const slug=t=>t.replace(/[«»"]/g,'').replace(/[^\wА-Яа-яЁё]+/g,'-').replace(/^-|-$/g,'');
function render(){
  document.body.classList.toggle('big',fmt==='big');
  $('grid').innerHTML=items().map((it,j)=>{const qr=svgOf(it.key);
    return `<div class="card" data-key="${it.key}" data-name="${String(j+1).padStart(2,'0')}-${slug(it.s.title)}">
    <div class="park">Город Саки · Курортный парк</div>
    <div class="qr">${qr.createSvgTag({cellSize:4,margin:2,scalable:true})}</div>
    <div><span class="num">${it.label}</span><b>${it.s.title}</b><span class="hint">Наведите камеру телефона — откроется рассказ об этом месте</span>
    <div class="r">Терренкур ${[...it.routes].sort().join(', ')}</div>
    <div class="url">${base}#cp-${it.key}</div>
    <div class="dl"><button type="button" data-dl="svg">SVG</button><button type="button" data-dl="png">PNG</button></div></div></div>`}).join('');
}
/* файлы для типографии: SVG — векторный, PNG — 2000 px, хватает на табличку до 17 см при 300 dpi */
function save(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2e3)}
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-dl]');if(!b)return;
  const c=b.closest('.card'),qr=svgOf(c.dataset.key),n=qr.getModuleCount(),q=4,name='qr-'+c.dataset.name;
  let d='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))d+=`M${x+q} ${y+q}h1v1h-1z`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*q} ${n+2*q}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  if(b.dataset.dl==='svg')return save(name+'.svg',new Blob([svg],{type:'image/svg+xml'}));
  const px=2000,cv=document.createElement('canvas'),im=new Image();cv.width=cv.height=px;
  im.onload=()=>{const g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(im,0,0,px,px);cv.toBlob(bl=>save(name+'.png',bl),'image/png')};
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
});
$('routes').insertAdjacentHTML('beforeend',[{id:0,name:'Все'},...ROUTES].map(r=>`<button type="button" data-r="${r.id}">${r.name}</button>`).join(''));
const sync=()=>{
  document.querySelectorAll('[data-r]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.r===rid));
  document.querySelectorAll('[data-f]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===fmt));
  const u=new URLSearchParams(location.search);rid?u.set('route',rid):u.delete('route');fmt==='big'?u.set('format','big'):u.delete('format');
  try{history.replaceState(null,'',location.pathname+(u+''?'?'+u:''))}catch(e){}
  render()};
document.querySelector('.head').addEventListener('click',e=>{const r=e.target.closest('[data-r]'),f=e.target.closest('[data-f]');
  if(r)rid=+r.dataset.r;else if(f)fmt=f.dataset.f;else return;sync()});
sync();
})();
</script>
